<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Nebraskan Major Search</title>
    <!-- Load Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the journalistic aesthetic */
        :root {
            --dn-red: #e30613; /* Daily Nebraskan Red */
            --dn-dark: #1f2937; /* Dark Gray for text */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
        .header-bg {
            background-color: var(--dn-red);
        }
        .text-dn-red {
            color: var(--dn-red);
        }
        .border-dn-red {
            border-color: var(--dn-red);
        }
        .loading-ring {
            display: inline-block;
            width: 80px;
            height: 80px;
        }
        .loading-ring:after {
            content: " ";
            display: block;
            width: 64px;
            height: 64px;
            margin: 8px;
            border-radius: 50%;
            border: 6px solid var(--dn-red);
            border-color: var(--dn-red) transparent var(--dn-red) transparent;
            animation: loading-ring 1.2s linear infinite;
        }
        @keyframes loading-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen antialiased">

    <!-- Header Section with Daily Nebraskan Logo -->
    <header class="header-bg shadow-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto p-4 flex items-center justify-between">
            <a href="https://www.dailynebraskan.com/" target="_blank">
                <!-- UPDATED LOGO URL -->
                <img src="https://bloximages.newyork1.vip.townnews.com/dailynebraskan.com/content/tncms/custom/image/7977647a-bd51-11ed-9a1b-271c59e332ff.png?resize=1200%2C188" alt="Daily Nebraskan Logo" class="h-10 w-auto" onerror="this.onerror=null; this.src='https://placehold.co/200x40/e30613/ffffff?text=DN+Data';" />
            </a>
            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight hidden sm:block">
                UNL Major Headcount Search
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- New Data Source Note -->
        <p class="text-xs font-semibold text-center sm:text-left text-dn-red mb-3">
            DATA CURRENT AS OF FALL 2025 SEMESTER
        </p>
        
        <p class="text-gray-600 mb-6 text-center sm:text-left">
            Search for your major, specialization, or college to see the student headcount.
        </p>

        <!-- Search Input -->
        <div class="mb-8 relative shadow-lg rounded-xl overflow-hidden">
            <input
                type="text"
                id="search-input"
                placeholder="Start typing a major (e.g., 'Journalism', 'Psychology', 'Engineering')"
                class="w-full p-4 text-lg border-2 border-dn-red rounded-xl focus:outline-none focus:ring-4 focus:ring-dn-red/20 transition-all pl-12"
                oninput="filterMajors(this.value)"
                autofocus
            >
            <!-- Search Icon -->
            <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- Result Count and Loading Indicator -->
        <div id="status-message" class="text-lg font-semibold text-gray-700 mb-4 flex justify-between items-center">
            <span id="result-count">Enter a search term above.</span>
            <div id="loading-indicator" class="hidden loading-ring h-8 w-8 scale-50"></div>
        </div>

        <!-- Results Container (Responsive Table) -->
        <div id="results-container" class="bg-white rounded-xl shadow-2xl overflow-hidden border border-gray-200">
            <!-- Results will be injected here -->
        </div>

        <p class="text-xs text-gray-500 mt-6 text-center">
            Data sourced from the university registrar. Headcounts reflect current enrollment.
        </p>
    </main>

    <script>
        // Global variables, but initialized later in DOMContentLoaded
        let MAJOR_DATA = [];
        let resultsContainer;
        let resultCountSpan;
        let loadingIndicator;
        let searchTimeout;

        /**
         * Cleans a string for searching (lowercase, remove non-alphanumeric/spaces).
         * @param {string} text
         * @returns {string}
         */
        function cleanText(text) {
            return text.toLowerCase().replace(/[^a-z0-9\s]/g, '');
        }

        /**
         * Filters the major data based on the search term.
         * @param {string} searchTerm - The text input from the user.
         */
        function filterMajors(searchTerm) {
            // Check if major data has been initialized
            if (MAJOR_DATA.length === 0) return;

            // Show loading indicator instantly
            loadingIndicator.classList.remove('hidden');
            resultCountSpan.textContent = "Searching...";
            resultsContainer.innerHTML = ''; // Clear old results

            // Debounce the search function to limit computation while typing fast
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const query = cleanText(searchTerm.trim());

                if (query.length < 2) {
                    loadingIndicator.classList.add('hidden');
                    if (query.length === 0) {
                        resultCountSpan.textContent = "Enter a search term above.";
                    } else {
                        resultCountSpan.textContent = "Keep typing (min 2 characters)...";
                    }
                    resultsContainer.innerHTML = '';
                    return;
                }

                const filtered = MAJOR_DATA.filter(item => {
                    const majorClean = cleanText(item.major_name);
                    const collegeClean = cleanText(item.college);
                    const specializationClean = cleanText(item.specialization);

                    return majorClean.includes(query) ||
                           collegeClean.includes(query) ||
                           specializationClean.includes(query);
                });

                // Sort results to prioritize matches with higher headcount
                filtered.sort((a, b) => b.headcount - a.headcount);

                renderResults(filtered, query);
            }, 300); // Wait 300ms after the last keystroke
        }

        /**
         * Renders the filtered results into the DOM.
         * @param {Array<Object>} results - The list of major objects.
         * @param {string} query - The search query (used for highlighting).
         */
        function renderResults(results, query) {
            loadingIndicator.classList.add('hidden');
            resultCountSpan.textContent = `${results.length} result${results.length !== 1 ? 's' : ''} found`;

            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="p-6 text-center text-gray-500">
                        <p class="text-xl">No majors matched your search.</p>
                        <p class="text-sm mt-1">Try a different spelling or a broader term.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden sm:table-cell">College</th>
                                <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Major / Specialization</th>
                                <th class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-1/5 sm:w-1/6 rounded-tr-xl">Headcount</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
            `;

            results.forEach((item, index) => {
                const isNoSpecialization = item.specialization === '-No Specialization-';
                const specializationDisplay = isNoSpecialization ? 'Standard' : item.specialization;

                // Function to highlight the query in the text
                const highlight = (text) => {
                    if (!query) return text;
                    const regex = new RegExp('(' + query + ')', 'gi');
                    return text.replace(regex, '<span class="bg-yellow-200 font-bold">$1</span>');
                };

                html += `
                    <tr class="${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-dn-red/10 transition-colors">
                        <td class="px-3 py-3 whitespace-nowrap text-sm text-gray-500 hidden sm:table-cell font-medium">
                            ${highlight(item.college)}
                        </td>
                        <td class="px-3 py-3 text-sm text-gray-900">
                            <div class="font-semibold text-base">${highlight(item.major_name)}</div>
                            <div class="text-xs text-gray-500">
                                ${isNoSpecialization ? '' : 'Spec: '}
                                <span class="${isNoSpecialization ? 'italic' : 'font-medium'}">${highlight(specializationDisplay)}</span>
                            </div>
                            <div class="text-xs text-gray-500 mt-1 sm:hidden">
                                College: ${highlight(item.college)}
                            </div>
                        </td>
                        <td class="px-3 py-3 whitespace-nowrap text-right text-lg font-extrabold text-dn-red">
                            ${item.headcount.toLocaleString()}
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            resultsContainer.innerHTML = html;
        }

        // Initial setup runs after the entire HTML document is loaded
        document.addEventListener('DOMContentLoaded', () => {
             // --- DATA INITIALIZATION MOVED HERE ---
             const dataElement = document.getElementById('majors-data');
             if (dataElement) {
                const rawMajorData = JSON.parse(dataElement.textContent);

                // Filter out the 'Total' entry as it skews search results
                MAJOR_DATA = rawMajorData.filter(item => item.major_name !== 'Total');
             }

             // Initialize DOM elements now that they exist
             resultsContainer = document.getElementById('results-container');
             resultCountSpan = document.getElementById('result-count');
             loadingIndicator = document.getElementById('loading-indicator');

             // For better UX, focus the search bar immediately
             document.getElementById('search-input').focus();
        });

    </script>
